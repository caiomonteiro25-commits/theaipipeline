# shows.mtrx.com.br — agenda de shows MTRX
# Instalado em /etc/nginx/sites-available/shows.mtrx.com.br pelo deploy.sh --setup.
# O HTTPS é adicionado depois pelo certbot (--nginx), que edita este bloco.

server {
    listen 80;
    listen [::]:80;
    server_name shows.mtrx.com.br;

    root /var/www/shows.mtrx.com.br;
    index index.html;

    # A agenda muda com frequência: nunca servir shows.json em cache
    location = /shows.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
